<!-- WIDGET autonome : epsilon-calibrator — collage direct dans le document, prefixe eps_ -->
<figure class="fig" id="epsilon-calibrator" style="margin:24px 0;">
  <style>
  /* portee locale au widget — prefixe eps_, fallback couleurs si tokens absents */
  #epsilon-calibrator .eps_wrap{font-family:"Archivo",system-ui,sans-serif;}
  #epsilon-calibrator .eps_lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--bordeaux,#7C2A38);font-weight:700;}
  #epsilon-calibrator .eps_h{font-family:"Archivo",system-ui,sans-serif;font-size:18px;font-weight:700;
    color:var(--blue-deep,#142E49);margin:3px 0 4px;letter-spacing:-.005em;}
  #epsilon-calibrator .eps_sub{font-family:"Spectral",Georgia,serif;font-size:14.5px;line-height:1.5;
    color:var(--ink-soft,#43536A);margin:0 0 16px;}
  #epsilon-calibrator .eps_ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;
    padding:14px 16px;background:#fff;border:1px solid var(--line-soft,#E7ECF3);
    border-left:3px solid var(--blue-deep,#142E49);border-radius:0 6px 6px 0;margin:0 0 14px;}
  #epsilon-calibrator .eps_field{display:flex;align-items:center;gap:11px;flex:1 1 320px;min-width:260px;}
  #epsilon-calibrator .eps_field>span{font-family:"JetBrains Mono",monospace;font-size:12px;
    color:var(--ink-faint,#7A889B);white-space:nowrap;}
  #epsilon-calibrator input[type=range].eps_slider{-webkit-appearance:none;appearance:none;flex:1;
    height:4px;border-radius:3px;background:var(--line,#D7DFE9);outline:none;margin:0;cursor:pointer;}
  #epsilon-calibrator input[type=range].eps_slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:17px;height:17px;border-radius:50%;background:var(--blue,#23537F);
    border:2px solid #fff;box-shadow:0 1px 3px rgba(20,46,73,.35);cursor:pointer;}
  #epsilon-calibrator input[type=range].eps_slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:var(--blue,#23537F);border:2px solid #fff;box-shadow:0 1px 3px rgba(20,46,73,.35);cursor:pointer;}
  #epsilon-calibrator .eps_readout{font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.7;
    color:var(--ink,#15202E);white-space:nowrap;}
  #epsilon-calibrator .eps_readout b{color:var(--blue-deep,#142E49);}
  #epsilon-calibrator .eps_eq{display:inline-block;padding:2px 9px;border-radius:3px;
    background:var(--bordeaux-wash,#F3E3E6);color:var(--bordeaux,#7C2A38);font-weight:700;}
  /* tableau des accepts candidats, calque .calc / .tbl */
  #epsilon-calibrator .eps_rows{display:flex;flex-direction:column;gap:7px;margin:0 0 4px;}
  #epsilon-calibrator .eps_row{display:grid;grid-template-columns:minmax(96px,1.1fr) auto auto 1fr;
    align-items:center;gap:10px 16px;padding:9px 14px;background:#fff;
    border:1px solid var(--line-soft,#E7ECF3);border-left:3px solid var(--line,#D7DFE9);border-radius:0 5px 5px 0;
    font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.5;transition:border-color .15s,background .15s;}
  #epsilon-calibrator .eps_row .eps_name{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:12.5px;
    color:var(--ink,#15202E);letter-spacing:.02em;}
  #epsilon-calibrator .eps_row .eps_margin{color:var(--ink-soft,#43536A);}
  #epsilon-calibrator .eps_row .eps_cmp{color:var(--ink-faint,#7A889B);font-size:11px;}
  #epsilon-calibrator .eps_row .eps_verdict{justify-self:end;font-family:"Archivo",system-ui,sans-serif;
    font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:right;}
  /* etats live */
  #epsilon-calibrator .eps_row.eps_ok{border-left-color:#1C6A4C;background:linear-gradient(0deg,rgba(28,106,76,.06),#fff);}
  #epsilon-calibrator .eps_row.eps_ok .eps_verdict{color:#1C6A4C;}
  #epsilon-calibrator .eps_row.eps_ok .eps_margin{color:#1C6A4C;font-weight:700;}
  #epsilon-calibrator .eps_row.eps_ko{border-left-color:var(--bordeaux,#7C2A38);background:linear-gradient(0deg,var(--bordeaux-wash,#F3E3E6),#fff);}
  #epsilon-calibrator .eps_row.eps_ko .eps_verdict{color:var(--bordeaux,#7C2A38);}
  #epsilon-calibrator .eps_row.eps_ko .eps_margin{color:var(--bordeaux,#7C2A38);font-weight:700;}
  #epsilon-calibrator .eps_dot{font-weight:700;}
  #epsilon-calibrator .eps_note{background:var(--bordeaux-wash,#F3E3E6);border:1px solid #E3C3C9;
    border-left:4px solid var(--bordeaux,#7C2A38);border-radius:6px;padding:13px 18px;margin:14px 0 0;
    font-family:"Spectral",Georgia,serif;}
  #epsilon-calibrator .eps_note .eps_ct{font-family:"Archivo",system-ui,sans-serif;font-weight:700;
    color:var(--bordeaux,#7C2A38);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;}
  #epsilon-calibrator .eps_note p{margin:0;font-size:14px;line-height:1.55;color:var(--ink,#15202E);}
  #epsilon-calibrator .eps_note em{font-style:italic;}
  #epsilon-calibrator figcaption .fcap-k{color:var(--bordeaux,#7C2A38);font-weight:700;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;margin-right:8px;font-family:"Archivo",system-ui,sans-serif;}
  @media(max-width:560px){
    #epsilon-calibrator .eps_row{grid-template-columns:1fr 1fr;}
    #epsilon-calibrator .eps_row .eps_cmp{grid-column:1 / -1;}
    #epsilon-calibrator .eps_row .eps_verdict{justify-self:start;}
  }
  </style>

  <div class="eps_wrap">
    <span class="eps_lbl">Widget interactif</span>
    <div class="eps_h">Calibrage de ε (plancher de bruit)</div>
    <p class="eps_sub">Règle l'écart-type du juge σ. Le seuil de domination se cale dessus : <b>ε = 2σ</b>. Chaque accept candidat survit s'il dépasse ce plancher, sinon il retourne sous le bruit et déclenche un rollback.</p>

    <div class="eps_ctrl">
      <label class="eps_field" for="eps_sigma">
        <span>σ (bruit du juge)</span>
        <input id="eps_sigma" class="eps_slider" type="range" min="0" max="0.20" step="0.01" value="0.08"
               aria-label="Écart-type du juge sigma">
      </label>
      <div class="eps_readout">
        σ = <b id="eps_sigmaOut">0.08</b> &nbsp;→&nbsp; ε = 2σ = <span class="eps_eq" id="eps_epsOut">0.16</span>
      </div>
    </div>

    <div class="eps_rows" id="eps_list" role="list" aria-live="polite"></div>

    <div class="eps_note">
      <div class="eps_ct">Invariant de détectabilité</div>
      <p>Un accept dont la marge mesurée est <em>plus fragile que le plancher de bruit</em> n'est pas un gain : son avantage tient dans le bruit du juge, pas dans la qualité. Sous ε, on ne peut pas le distinguer d'un tirage chanceux → <em>rollback</em>.</p>
    </div>
  </div>

  <figcaption><span class="fcap-k">Live</span>Déplace σ : le seuil ε = 2σ se recalcule et chaque candidat bascule entre « survit » (vert, marge &gt; ε) et « sous le bruit → rollback » (rouge, marge ≤ ε).</figcaption>

  <script>
  (function(){
    var root = document.getElementById('epsilon-calibrator');
    if(!root || root.dataset.epsInit) return;        // anti double-init
    root.dataset.epsInit = '1';

    var slider  = root.querySelector('#eps_sigma');
    var sigmaO  = root.querySelector('#eps_sigmaOut');
    var epsO    = root.querySelector('#eps_epsOut');
    var list    = root.querySelector('#eps_list');

    // accepts candidats : liste fixe (nom, marge mesurée vs titulaire)
    var EPS_ACCEPTS = [
      { name:'accept #1', margin:0.07 },
      { name:'accept #2', margin:0.12 },
      { name:'accept #3', margin:0.19 },
      { name:'accept #4', margin:0.31 }
    ];

    function eps_fmt(x, signed){
      var s = x.toFixed(2);
      return signed && x >= 0 ? '+' + s : s;
    }

    // markup initial des lignes (une seule fois)
    EPS_ACCEPTS.forEach(function(a, i){
      var row = document.createElement('div');
      row.className = 'eps_row';
      row.setAttribute('role','listitem');
      row.id = 'eps_row_' + i;
      row.innerHTML =
        '<span class="eps_name">' + a.name + '</span>' +
        '<span class="eps_margin">marge ' + eps_fmt(a.margin, true) + '</span>' +
        '<span class="eps_cmp" data-cmp></span>' +
        '<span class="eps_verdict" data-verdict></span>';
      list.appendChild(row);
    });

    function eps_render(){
      var sigma = parseFloat(slider.value);
      var eps   = 2 * sigma;
      sigmaO.textContent = eps_fmt(sigma, false);
      epsO.textContent   = eps_fmt(eps, false);

      EPS_ACCEPTS.forEach(function(a, i){
        var row     = root.querySelector('#eps_row_' + i);
        var cmpEl   = row.querySelector('[data-cmp]');
        var verdEl  = row.querySelector('[data-verdict]');
        var survives = a.margin > eps;       // strictement au-dessus du plancher

        row.classList.toggle('eps_ok', survives);
        row.classList.toggle('eps_ko', !survives);

        cmpEl.textContent = eps_fmt(a.margin, true) + (survives ? ' > ' : ' ≤ ') + 'ε ' + eps_fmt(eps, false);
        verdEl.innerHTML  = survives
          ? '<span class="eps_dot">▲</span> survit (&gt; ε)'
          : '<span class="eps_dot">▼</span> sous le bruit → rollback';
      });
    }

    slider.addEventListener('input', eps_render);
    eps_render();
  })();
  </script>
</figure>
