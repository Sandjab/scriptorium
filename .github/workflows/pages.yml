name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule la précédente si elle tourne encore.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Assemble _site/
        run: python tools/build_site.py
      # Compteur de visites anonyme (GoatCounter, sans cookie) : posé sur la
      # copie publiée seulement, jamais dans les sources. Le grep échoue si
      # l'injection n'a rien touché.
      - name: Poser le compteur de visites
        run: |
          find _site -name '*.html' -exec sed -i 's|</body>|<script data-goatcounter="https://sandjab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>\n</body>|' {} +
          grep -rl goatcounter _site --include='*.html' >/dev/null
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
