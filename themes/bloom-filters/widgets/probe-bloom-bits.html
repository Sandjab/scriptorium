<div class="widget bfw-root" id="bfw-root">
  <style>
    .bfw-root{--bfw-on:var(--blue-bright,#2C77B6);--bfw-off:var(--line,#D7DFE9);
      --bfw-hit:var(--blue,#23537F);--bfw-yes:var(--bordeaux-bright,#9B3443);
      --bfw-no:var(--blue,#23537F);--bfw-ink:var(--ink,#15202E);
      --bfw-soft:var(--ink-soft,#43536A);--bfw-faint:var(--ink-faint,#7A889B);
      --bfw-card:var(--card,#fff);--bfw-line:var(--line,#D7DFE9);
      font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--bfw-ink);
      border:1px solid var(--bfw-line);border-radius:12px;padding:18px 18px 16px;
      background:var(--bfw-card);max-width:680px}
    .bfw-root *{box-sizing:border-box}
    .bfw-k{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
      color:var(--bfw-faint);font-weight:600;margin:0 0 2px}
    .bfw-title{font-weight:700;font-size:1.05rem;margin:0 0 10px}
    .bfw-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
    .bfw-in{flex:1 1 150px;min-width:120px;padding:8px 10px;border:1px solid var(--bfw-line);
      border-radius:8px;font:inherit;color:var(--bfw-ink);background:var(--bfw-card)}
    .bfw-btn{padding:8px 13px;border:1px solid var(--bfw-hit);border-radius:8px;
      background:var(--bfw-hit);color:#fff;font:600 14px/1 inherit;cursor:pointer}
    .bfw-btn.bfw-ghost{background:transparent;color:var(--bfw-hit)}
    .bfw-btn:hover{filter:brightness(1.08)}
    .bfw-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:0 0 6px}
    .bfw-bit{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
      border-radius:6px;background:var(--bfw-off);color:var(--bfw-faint);
      font:600 12px/1 ui-monospace,monospace;transition:background .18s,transform .18s,color .18s}
    .bfw-bit.bfw-set{background:var(--bfw-on);color:#fff}
    .bfw-bit.bfw-flash{transform:scale(1.18);box-shadow:0 0 0 2px var(--bfw-hit)}
    .bfw-bit.bfw-miss{box-shadow:0 0 0 2px var(--bfw-no);background:var(--bfw-card);color:var(--bfw-no)}
    .bfw-idx{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:0 0 12px}
    .bfw-idx span{text-align:center;font:500 10px/1 ui-monospace,monospace;color:var(--bfw-faint)}
    .bfw-out{min-height:2.6em;padding:10px 12px;border-radius:8px;border:1px solid var(--bfw-line);
      background:var(--bfw-card);font-size:.95rem}
    .bfw-out.bfw-yes{border-color:var(--bfw-yes);color:var(--bfw-yes)}
    .bfw-out.bfw-no{border-color:var(--bfw-no);color:var(--bfw-no)}
    .bfw-out b{font-weight:700}
    .bfw-meta{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;font-size:.82rem;color:var(--bfw-soft)}
    .bfw-meta b{color:var(--bfw-ink)}
    .bfw-set-list{margin:6px 0 0;font-size:.8rem;color:var(--bfw-soft)}
    .bfw-set-list code{background:var(--bfw-off);padding:1px 6px;border-radius:5px;margin:2px 4px 2px 0;
      display:inline-block;font-size:.82em}
  </style>

  <p class="bfw-k">Démonstration interactive</p>
  <p class="bfw-title">Insère, interroge : regarde les bits s'allumer (m = 24, k = 3)</p>

  <div class="bfw-ctl">
    <input class="bfw-in" id="bfw-input" type="text" placeholder="un mot, ex. chat" autocomplete="off">
    <button class="bfw-btn" id="bfw-add" type="button">Insérer</button>
    <button class="bfw-btn bfw-ghost" id="bfw-query" type="button">Interroger</button>
    <button class="bfw-btn bfw-ghost" id="bfw-reset" type="button">Vider</button>
  </div>

  <div class="bfw-grid" id="bfw-grid"></div>
  <div class="bfw-idx" id="bfw-idx"></div>

  <div class="bfw-out" id="bfw-out">Insère un mot, puis interroge-le — ou interroge un mot jamais inséré pour provoquer un faux positif quand le tableau se remplit.</div>

  <div class="bfw-meta">
    <span>bits à 1 : <b id="bfw-fill">0</b>/24</span>
    <span>insérés : <b id="bfw-count">0</b></span>
    <span>faux positifs possibles : <b id="bfw-fp">0,0 %</b></span>
  </div>
  <p class="bfw-set-list" id="bfw-inserted"></p>

  <script>
  (function(){
    var root=document.getElementById("bfw-root");
    if(!root||root.dataset.bfwInit)return; root.dataset.bfwInit="1";
    var M=24,K=3;
    var bits=new Array(M).fill(0);
    var inserted=[];
    var grid=document.getElementById("bfw-grid");
    var idx=document.getElementById("bfw-idx");
    var out=document.getElementById("bfw-out");
    var listEl=document.getElementById("bfw-inserted");
    var input=document.getElementById("bfw-input");
    var cells=[];
    for(var i=0;i<M;i++){
      var c=document.createElement("div");
      c.className="bfw-bit"; c.textContent="0"; grid.appendChild(c); cells.push(c);
      var s=document.createElement("span"); s.textContent=i; idx.appendChild(s);
    }
    // k déterministe : trois hachages distincts d'une même chaîne, repliés sur [0,M)
    function hashes(str){
      var s=str.trim().toLowerCase();
      var seeds=[2166136261,5381,7919], res=[];
      for(var j=0;j<K;j++){
        var h=seeds[j]>>>0;
        for(var i=0;i<s.length;i++){
          h=((h^s.charCodeAt(i))*16777619)>>>0;
          h=((h<<13)|(h>>>19))>>>0;
        }
        res.push(h%M);
      }
      return res;
    }
    // construit un message sûr : suite de [texte | {b:gras}] -> nœuds DOM (pas d'innerHTML)
    function say(cls,parts){
      out.className="bfw-out"+(cls?" "+cls:"");
      while(out.firstChild)out.removeChild(out.firstChild);
      parts.forEach(function(p){
        if(typeof p==="string"){out.appendChild(document.createTextNode(p));}
        else{var b=document.createElement("b");b.textContent=p.b;out.appendChild(b);}
      });
    }
    function render(){
      var fill=0;
      for(var i=0;i<M;i++){
        cells[i].classList.remove("bfw-miss");
        if(bits[i]){cells[i].classList.add("bfw-set");cells[i].textContent="1";fill++;}
        else{cells[i].classList.remove("bfw-set");cells[i].textContent="0";}
      }
      document.getElementById("bfw-fill").textContent=fill;
      document.getElementById("bfw-count").textContent=inserted.length;
      var p=Math.pow(fill/M,K)*100;
      document.getElementById("bfw-fp").textContent=p.toFixed(1).replace(".",",")+" %";
      while(listEl.firstChild)listEl.removeChild(listEl.firstChild);
      if(inserted.length){
        listEl.appendChild(document.createTextNode("insérés : "));
        inserted.forEach(function(w){
          var code=document.createElement("code");code.textContent=w;listEl.appendChild(code);
        });
      }
    }
    function flash(pos,miss){
      pos.forEach(function(i){
        cells[i].classList.add(miss&&!bits[i]?"bfw-miss":"bfw-flash");
        setTimeout(function(){cells[i].classList.remove("bfw-flash","bfw-miss");render();},900);
      });
    }
    function add(){
      var w=input.value.trim();
      if(!w){say("",["Tape un mot d'abord."]);return;}
      var pos=hashes(w);
      pos.forEach(function(i){bits[i]=1;});
      if(inserted.indexOf(w.toLowerCase())<0)inserted.push(w.toLowerCase());
      render(); flash(pos,false);
      say("",["Inséré ",{b:w}," — bits "+pos.join(", ")+" mis à 1. "+
        "Ces bits ne repasseront jamais à 0 : c'est ce qui interdit les faux négatifs."]);
      input.select();
    }
    function query(){
      var w=input.value.trim();
      if(!w){say("",["Tape un mot d'abord."]);return;}
      var pos=hashes(w);
      var allSet=pos.every(function(i){return bits[i]===1;});
      flash(pos,!allSet);
      var known=inserted.indexOf(w.toLowerCase())>=0;
      if(!allSet){
        say("bfw-no",[{b:"Certainement absent."}," Au moins un des bits "+pos.join(", ")+
          " vaut 0 → réponse exacte et définitive (jamais de faux négatif)."]);
      }else if(known){
        say("bfw-no",[{b:"Probablement présent"}," — et de fait ",{b:"inséré"},
          ". Les bits "+pos.join(", ")+" sont tous à 1."]);
      }else{
        say("bfw-yes",[{b:"Probablement présent… mais jamais inséré : faux positif."},
          " Les bits "+pos.join(", ")+" ont tous été allumés par d'autres mots. "+
          "Plus le tableau se remplit, plus c'est fréquent."]);
      }
    }
    function reset(){
      bits=new Array(M).fill(0); inserted=[]; render();
      say("",["Tableau vidé. Tous les bits sont à 0."]);
    }
    document.getElementById("bfw-add").addEventListener("click",add);
    document.getElementById("bfw-query").addEventListener("click",query);
    document.getElementById("bfw-reset").addEventListener("click",reset);
    input.addEventListener("keydown",function(e){if(e.key==="Enter")add();});
    render();
  })();
  </script>
</div>
