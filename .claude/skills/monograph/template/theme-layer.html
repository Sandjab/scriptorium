<!-- ───────────────────────────────────────────────────────────────────
     COUCHE THÈME — bouton bascule dark-mode + infobulles de glossaire.
     Extrait du widget theme-tooltips (CSS exclus : voir charte.css).
     Injecté verbatim dans toutes les éditions à l'emplacement du jeton THEME_LAYER.
     ─────────────────────────────────────────────────────────────────── -->

<!-- (B) BOUTON BASCULE -->
<button id="theme_toggle" type="button" aria-pressed="false"
        title="Basculer le thème clair / sombre">
  <span id="theme_toggle_ico" aria-hidden="true">☾</span>
  <span id="theme_toggle_lbl">Sombre</span>
</button>

<!-- Popover unique réutilisé (créé aussi par JS en secours) -->
<div id="theme_tip" role="tooltip" aria-hidden="true"></div>

<!-- SCRIPT — (B) bascule + persistance, (C) infobulles accessibles.
     Tout en IIFE, fonctions préfixées theme_. Aucun alert. -->
<script>
(function(){
  "use strict";
  var KEY = "theme_pref_v1";
  var docEl = document.documentElement;

  /* ---- stockage sûr : jamais d'erreur si localStorage indisponible ---- */
  function theme_read(){
    try { return window.localStorage.getItem(KEY); } catch(e){ return null; }
  }
  function theme_write(v){
    try { window.localStorage.setItem(KEY, v); } catch(e){ /* silencieux */ }
  }

  /* ---- (B) application du thème ---- */
  function theme_apply(mode, persist){
    var dark = (mode === "dark");
    if (dark) docEl.setAttribute("data-theme","dark");
    else docEl.removeAttribute("data-theme");
    var btn = document.getElementById("theme_toggle");
    if (btn){
      btn.setAttribute("aria-pressed", dark ? "true" : "false");
      var ico = document.getElementById("theme_toggle_ico");
      var lbl = document.getElementById("theme_toggle_lbl");
      if (ico) ico.textContent = dark ? "☀" : "☾";
      if (lbl) lbl.textContent = dark ? "Clair" : "Sombre";
    }
    if (persist) theme_write(dark ? "dark" : "light");
  }

  /* Appliquer la préférence au plus tôt (limite le flash). */
  theme_apply(theme_read() === "dark" ? "dark" : "light", false);

  function theme_initToggle(){
    var btn = document.getElementById("theme_toggle");
    if (!btn) return;
    btn.addEventListener("click", function(){
      docEl.classList.add("theme-anim"); /* transitions seulement sur action */
      var nowDark = docEl.getAttribute("data-theme") === "dark";
      theme_apply(nowDark ? "light" : "dark", true);
    });
  }

  /* ---- (C) infobulles accessibles ---- */
  var tip = null, current = null, uid = 0;

  function theme_tipEl(){
    if (tip) return tip;
    tip = document.getElementById("theme_tip");
    if (!tip){
      tip = document.createElement("div");
      tip.id = "theme_tip";
      tip.setAttribute("role","tooltip");
      tip.setAttribute("aria-hidden","true");
      document.body.appendChild(tip);
    }
    return tip;
  }

  function theme_show(el){
    var def = el.getAttribute("data-def");
    if (!def) return;
    var t = theme_tipEl();
    t.textContent = def; /* textContent : aucune injection HTML possible */
    if (!el.id) el.id = "theme_gloss_" + (++uid);
    t.id = "theme_tip"; /* stable */
    el.setAttribute("aria-describedby", "theme_tip");

    /* mesure puis positionnement (au-dessus si la place le permet) */
    t.style.left = "0px"; t.style.top = "0px";
    t.setAttribute("aria-hidden","false");
    t.setAttribute("data-show","1");

    var r = el.getBoundingClientRect();
    var tw = t.offsetWidth, th = t.offsetHeight;
    var sx = window.pageXOffset, sy = window.pageYOffset;
    var margin = 8;

    var left = r.left + sx + (r.width/2) - (tw/2);
    left = Math.max(sx + margin, Math.min(left, sx + document.documentElement.clientWidth - tw - margin));

    var below = (r.top < th + 12); /* pas de place au-dessus → on passe dessous */
    var top = below ? (r.bottom + sy + 8) : (r.top + sy - th - 8);
    if (below) t.setAttribute("data-below","1"); else t.removeAttribute("data-below");

    /* recentre la flèche sur le terme */
    var ax = (r.left + sx + r.width/2) - left;
    ax = Math.max(8, Math.min(ax, tw - 16));
    t.style.setProperty("--theme-tip-ax", ax + "px");

    t.style.left = left + "px";
    t.style.top = top + "px";
    current = el;
  }

  function theme_hide(){
    if (!tip) return;
    tip.removeAttribute("data-show");
    tip.setAttribute("aria-hidden","true");
    if (current){
      current.removeAttribute("aria-describedby");
      current = null;
    }
  }

  function theme_wire(el){
    if (el.getAttribute("data-theme-wired")) return;
    el.setAttribute("data-theme-wired","1");
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex","0");
    el.addEventListener("mouseenter", function(){ theme_show(el); });
    el.addEventListener("mouseleave", theme_hide);
    el.addEventListener("focus", function(){ theme_show(el); });
    el.addEventListener("blur", theme_hide);
  }

  function theme_scan(root){
    var nodes = (root || document).querySelectorAll(".theme-gloss[data-def]");
    for (var i=0;i<nodes.length;i++) theme_wire(nodes[i]);
  }

  /* Échap referme ; un défilement masque l'infobulle (position figée sinon) */
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" || e.keyCode === 27) theme_hide();
  });
  window.addEventListener("scroll", theme_hide, true);

  /* Termes ajoutés dynamiquement après coup */
  function theme_observe(){
    if (typeof MutationObserver === "undefined") return;
    var mo = new MutationObserver(function(muts){
      for (var i=0;i<muts.length;i++){
        var added = muts[i].addedNodes;
        for (var j=0;j<added.length;j++){
          var n = added[j];
          if (n.nodeType === 1){
            if (n.classList && n.classList.contains("theme-gloss")) theme_wire(n);
            if (n.querySelectorAll) theme_scan(n);
          }
        }
      }
    });
    mo.observe(document.body, {childList:true, subtree:true});
  }

  /* ---- init ---- */
  function theme_init(){
    theme_apply(theme_read() === "dark" ? "dark" : "light", false);
    theme_initToggle();
    theme_scan(document);
    theme_observe();
  }
  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", theme_init);
  } else {
    theme_init();
  }
})();
</script>
