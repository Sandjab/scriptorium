<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--%TITLE%--></title>
<style>
<!--%FONTS%-->
<!--%CHARTE%-->
</style>
</head>
<body>
<div id="prog" style="width:0%"></div>
<header class="top"><div class="top-in">
  <p class="kicker"><!--%KICKER%--></p>
  <h1><!--%H1%--></h1>
  <p class="lede"><!--%LEDE%--></p>
  <div class="meta"><!--%META%--></div>
</div></header>
<div class="wrap">
<nav class="toc" id="toc"><!--%TOC%--></nav>
<main>
<!--%MAIN%-->
</main>
</div>
<!--%THEME_LAYER%-->
<footer><div class="fin"><!--%FOOTER%--></div></footer>
<script>
  const prog=document.getElementById('prog');
  const onScroll=()=>{const h=document.documentElement;const sc=h.scrollTop;const max=h.scrollHeight-h.clientHeight;
    prog.style.width=(max>0?(sc/max*100):0)+'%';};
  document.addEventListener('scroll',onScroll,{passive:true});onScroll();
  const links=[...document.querySelectorAll('nav.toc a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{
    if(e.isIntersecting){links.forEach(l=>l.classList.remove('active'));
      const a=map.get(e.target.id); if(a)a.classList.add('active');}});
  },{rootMargin:'-12% 0px -78% 0px',threshold:0});
  document.querySelectorAll('section[id]').forEach(s=>obs.observe(s));
</script>
</body></html>
